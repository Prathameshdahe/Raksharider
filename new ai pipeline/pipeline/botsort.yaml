# RoadWatch BoT-SORT configuration (Ultralytics tracker format)
# Dense frames (~15 fps) from a MOVING dashcam: global motion compensation on,
# appearance re-identification on, lost tracks kept for ~3 s.
tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.30
track_buffer: 45
match_thresh: 0.80
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.50
appearance_thresh: 0.75
with_reid: True
model: auto
